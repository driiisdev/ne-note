# PostgreSQL host-based authentication: evaluated top to bottom, FIRST matching line wins.
#
# TYPE  DATABASE  USER  ADDRESS          METHOD

# Unix-socket connections inside the db container (used by the image's init scripts)
local   all       all                    trust

# The app container, and only the app container, may log in to "shop" as "app", with a password
host    shop      app   172.30.0.10/32   scram-sha-256

# Everyone else is turned away before a password is even asked for
host    all       all   0.0.0.0/0        reject
